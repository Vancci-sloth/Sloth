# La app que se vende sale de la rama `venta`: cada push compila Sloth en Windows, Mac (Intel, Apple Silicon y la de
# macOS 12) y Linux,
# y publica sus instaladores en el cobro (`npm run compilar` y `npm run publicar` en cada sistema), los que da sloth.vancci.org.
# Cada push sale como versión nueva (scripts/version-venta.mjs, una sola vez para todos), y la app instalada ofrece
# «Actualizar a Sloth X» y la baja (entera en Windows, por diferencias en Mac y Linux; electron/main.ts).
# Para publicar lo de main: `git push origin main:venta`. La llave para publicar es el secreto PUBLICAR del repo. La firma
# de Apple, si está, va en los secretos CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD y APPLE_TEAM_ID
# (docs/adr/0006-mac-y-linux.md): las de Mac salen firmadas y notarizadas, sin esperar a Apple más de 10 min
# (scripts/notarizar.mjs). Siempre el mismo certificado: macOS solo se actualiza a una versión firmada por el mismo
# equipo de Apple que la instalada. Quien apoya recibe cada versión 7 días
# antes; un arreglo urgente sale para todos de inmediato con `[para todos]` en el mensaje del commit, o con esa opción a
# mano.
name: Publicar Sloth

on:
  push:
    branches: [venta]
  workflow_dispatch:
    inputs:
      para_todos:
        description: 'Para todos de inmediato (un arreglo urgente), sin los 7 días de quien apoya'
        type: boolean
        default: false

# Una a la vez: dos publicaciones juntas se pisarían la versión.
concurrency:
  group: venta
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: node scripts/version-venta.mjs >> "$GITHUB_OUTPUT"
        env:
          PUBLICAR: ${{ secrets.PUBLICAR }}

  publicar:
    needs: version
    strategy:
      # Si uno falla, los otros publican igual: cada sistema tiene su propia última versión.
      fail-fast: false
      matrix:
        # Tres de Mac, cada una con su última versión en el cobro (docs/adr/0006): Intel, Apple Silicon y macOS 12.
        # La de macOS 12 sale en un Mac con Intel, con Electron 43 y Node 22: Electron 44 y Node 24 ya no abren ahí
        # (SLOTH_MAC12, scripts/compilar.mjs).
        include:
          - { os: windows-latest, node: 24.18.0 }
          - { os: macos-15-intel, node: 24.18.0 }
          - { os: macos-15, node: 24.18.0 }
          - { os: macos-15-intel, node: 22.23.4, mac12: '1' }
          - { os: ubuntu-latest, node: 24.18.0 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # El Node que viaja dentro de la app: el mismo con que se prueba en la computadora del dueño.
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/version-venta.mjs
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - run: npm run compilar
        env:
          SLOTH_MAC12: ${{ matrix.mac12 }}
          SLOTH_TUYO: ${{ secrets.SLOTH_TUYO }}
          # Solo a las de Mac: con el certificado de Apple, electron-builder también firmaba el de Windows, que no confía
          # en él, y la 0.4.0 y la 0.4.1 de Windows se quedaron sin poder actualizarse solas (scripts/compilar.mjs).
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Comprobar instalación y actualización antes de publicar Windows
        if: runner.os == 'Windows'
        run: node scripts/comprobar-instalacion.mjs
      - run: npm run publicar
        env:
          SLOTH_MAC12: ${{ matrix.mac12 }}
          PUBLICAR: ${{ secrets.PUBLICAR }}
          PARA_TODOS: ${{ (inputs.para_todos || contains(github.event.head_commit.message, '[para todos]')) && '1' || '' }}
          # Para que el cobro sepa si la de Mac se abre a la primera.
          FIRMADA: ${{ secrets.CSC_LINK != '' && '1' || '' }}
