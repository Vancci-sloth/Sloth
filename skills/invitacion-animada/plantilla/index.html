<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,500&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #02030a; overflow: hidden; }
  /* El cuadro es vertical 9:16 y todo se mide en cqh (alto del cuadro): se ve igual en cualquier pantalla */
  #frame {
    position: relative; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw;
    margin: 0 auto; overflow: hidden; cursor: pointer; user-select: none; container-type: size;
  }
  #frame canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity .9s ease; }
  #frame.ready canvas { opacity: 1; }
  #frame.instant canvas { transition: none; }
  #loader {
    position: absolute; left: 50%; top: 50%; width: 5cqh; height: 5cqh; margin: -2.5cqh 0 0 -2.5cqh; pointer-events: none;
    background: radial-gradient(circle, #fff6dc 0 12%, rgba(255, 214, 140, .55) 22%, transparent 62%);
    clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%);
    animation: titila 1.4s ease-in-out infinite; transition: opacity .5s;
  }
  #frame.ready #loader { opacity: 0; animation: none; }
  @keyframes titila { 0%, 100% { transform: scale(.7) rotate(0deg); opacity: .5 } 50% { transform: scale(1.15) rotate(45deg); opacity: 1 } }
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 52%, transparent 52%, rgba(0, 0, 10, .62) 100%);
  }
  .ui { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; }
  #title { top: 5.5cqh; opacity: 0; }
  #title .xv {
    font: 600 2.15cqh "Cinzel", serif; color: #f7e9c6; letter-spacing: .5em; padding-left: .5em;
    text-shadow: 0 0 1.4cqh rgba(255, 210, 140, .55);
  }
  #title .xv span { display: inline-block; }
  /* El brillo va en una copia fija detrás; así el destello que recorre el nombre no obliga a repintar el resplandor */
  #title .name-box { display: inline-block; position: relative; margin-top: -.4cqh; }
  #title .name { padding: 0 5cqh; font: 9.6cqh/1.25 "Great Vibes", cursive; color: transparent; }
  #title .name.glow { position: absolute; inset: 0; text-shadow: 0 0 1.1cqh rgba(255, 196, 110, .55); }
  #title .name.gold {
    position: relative; will-change: transform;
    background: linear-gradient(100deg, #a8782a 0%, #f3d488 18%, #fff6d6 27%, #d6a24a 40%, #fff3cf 50%, #c99236 62%, #ffe4a0 78%, #a8782a 100%);
    background-size: 260% 100%; -webkit-background-clip: text; background-clip: text;
  }
  #title .line {
    width: 48%; height: 1px; margin: .2cqh auto 1.1cqh; position: relative; transform: scaleX(0);
    background: linear-gradient(90deg, transparent, #e9c47c 30%, #fff1c8 50%, #e9c47c 70%, transparent);
  }
  #title .line::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: .9cqh; height: .9cqh;
    transform: translate(-50%, -50%) rotate(45deg); background: #fff1c8; box-shadow: 0 0 1cqh #ffd690;
  }
  #title .sub {
    font: italic 500 2.75cqh "Cormorant Garamond", serif; color: #f4e6c8; letter-spacing: .04em;
    text-shadow: 0 0 1cqh rgba(0, 0, 20, .9), 0 0 2cqh rgba(255, 200, 130, .35);
  }
  #intro {
    top: 9cqh; font: italic 500 3.6cqh "Cormorant Garamond", serif; color: #f1e2c2; opacity: 0;
    text-shadow: 0 0 1.4cqh rgba(255, 210, 150, .45);
  }
  #hint { bottom: 7.5cqh; opacity: 0; }
  #hint .pill {
    display: inline-block; padding: 1.25cqh 3.2cqh 1.1cqh; border-radius: 99px;
    border: 1px solid rgba(255, 222, 160, .55); background: rgba(8, 12, 34, .62);
    box-shadow: 0 0 2.4cqh rgba(255, 200, 120, .25), inset 0 0 1.2cqh rgba(255, 220, 160, .12);
  }
  #hint .a { font: 600 1.65cqh "Cinzel", serif; letter-spacing: .24em; color: #fbecc9; }
  #hint .b { font: italic 500 1.75cqh "Cormorant Garamond", serif; color: #e8d6b4; margin-top: .3cqh; letter-spacing: .05em; }
  /* tamaño fijo y escala por transform: moverlos no recalcula el diseño de la página */
  #ring, #ripple {
    position: absolute; left: 0; top: 0; width: 26cqh; height: 26cqh; border-radius: 50%; pointer-events: none;
    border: 1px solid rgba(255, 230, 180, .8); box-shadow: 0 0 1.5cqh rgba(255, 210, 140, .6), inset 0 0 1.5cqh rgba(255, 210, 140, .4);
    opacity: 0; transform: translate(-50%, -50%); will-change: transform, opacity;
  }
  #ripple { width: 44cqh; height: 44cqh; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="frame">
  <div id="vignette"></div>
  <div id="loader"></div>
  <div id="ring"></div><div id="ripple"></div>
  <div class="ui" id="intro"></div>
  <div class="ui" id="title">
    <div class="xv"></div>
    <div class="name-box"><div class="name glow" aria-hidden="true"></div><div class="name gold"></div></div>
    <div class="line"></div>
    <div class="sub"></div>
  </div>
  <div class="ui" id="hint"><div class="pill"><div class="a"></div><div class="b"></div></div></div>
</div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { Reflector } from "three/addons/objects/Reflector.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

// ---------- textos de la invitación: lo que cambia de un cliente a otro ----------
const TEXTOS = {
  intro: "Érase una vez…",
  arriba: "MIS XV AÑOS",
  nombre: "Valentina",
  abajo: "Te invito a mi fiesta",
  pista: "TOCA LA LUZ",
  pistaSub: "para abrir tu invitación",
};

// ---------- línea de tiempo (segundos de la secuencia S) ----------
// 0 → TAP: espera con la pista · TAP → FLASH: magia · FLASH: transformación · después: título y ambiente vivo
const TAP = 1.0, FLASH = 2.4, DURATION = 5.4;
const params = new URLSearchParams(location.search);
const frozenT = params.has("t") ? parseFloat(params.get("t")) : null;   // ?t=3.2 congela ese instante (capturas)

await Promise.all(['600 40px "Cinzel"', '80px "Great Vibes"', 'italic 500 40px "Cormorant Garamond"'].map((f) => document.fonts.load(f).catch(() => {})));

// ---------- utilidades ----------
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const easeInCubic = (x) => x * x * x;
const easeInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeInOutSine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
const easeOutBack = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pulse = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const NOISE_GLSL = /* glsl */ `
float dkHash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float dkNoise(vec3 x){
  vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(dkHash(i), dkHash(i + vec3(1,0,0)), f.x),
                 mix(dkHash(i + vec3(0,1,0)), dkHash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(dkHash(i + vec3(0,0,1)), dkHash(i + vec3(1,0,1)), f.x),
                 mix(dkHash(i + vec3(0,1,1)), dkHash(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float dkFbm(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++){ s += a * dkNoise(p); p *= 2.03; a *= 0.5; } return s; }
`;
const PLAIN_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;

function canvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
const allTextures = [];   // se suben a la GPU al arrancar (warmUp), para que nada tironee al aparecer
function tex(c, srgb, aniso = 4) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = aniso;
  allTextures.push(t);
  return t;
}
const lienzos = {};   // lienzos pintados que conviene revisar como PNG (scripts/volcar-lienzos.mjs)
window.__lienzos = lienzos;

// ---------- renderer / escena ----------
const frame = document.getElementById("frame");
// Sin MSAA en el lienzo: la escena se dibuja en los buffers del posproceso, donde no aplica.
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", preserveDrawingBuffer: frozenT !== null });
const MAX_PR = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(MAX_PR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
frame.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#02030a");
scene.fog = new THREE.Fog("#0b1236", 7, 19);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(38, 9 / 16, 0.05, 60);
scene.add(camera);
// Capa 1: lo que no conviene repetir en el reflejo del suelo (no se ve ahí). La cámara principal ve ambas.
camera.layers.enable(1);

// ---------- cielo: degradado, estrellas, luna y nubes ----------
const SKY_W = 22, SKY_H = 15, SKY_Z = -15, SKY_Y = 4.2;
const skyU = { uTime: { value: 0 }, uFlash: { value: 0 } };
const sky = new THREE.Mesh(new THREE.PlaneGeometry(SKY_W, SKY_H), new THREE.ShaderMaterial({
  uniforms: skyU, depthWrite: false, fog: false,
  vertexShader: PLAIN_VERT,
  fragmentShader: NOISE_GLSL + /* glsl */ `
    varying vec2 vUv; uniform float uTime, uFlash;
    void main(){
      vec2 asp = vec2(${(SKY_W / SKY_H).toFixed(4)}, 1.0);
      vec2 p = vUv * asp;
      float hy = ${((0 - (SKY_Y - SKY_H / 2)) / SKY_H).toFixed(4)};
      float y = (vUv.y - hy) / (1.0 - hy);
      vec3 c = mix(vec3(0.075, 0.09, 0.24), vec3(0.012, 0.016, 0.07), smoothstep(0.0, 0.42, y));
      c = mix(c, vec3(0.004, 0.006, 0.03), smoothstep(0.4, 0.75, y));
      c += vec3(0.32, 0.18, 0.3) * 0.2 * exp(-pow(max(y, 0.0) / 0.06, 1.3)) * smoothstep(0.62, 0.0, abs(vUv.x - 0.5));
      for (int k = 0; k < 2; k++) {
        float sc = k == 0 ? 190.0 : 85.0;
        vec2 g = floor(p * sc); vec2 f = fract(p * sc) - 0.5;
        float h = dkHash(vec3(g, 3.0 + float(k)));
        vec2 off = vec2(dkHash(vec3(g, 7.0)), dkHash(vec3(g, 9.0))) - 0.5;
        float s = step(k == 0 ? 0.985 : 0.993, h) * (1.0 - smoothstep(0.0, k == 0 ? 0.2 : 0.3, length(f - off * 0.5)));
        float tw = 0.55 + 0.45 * sin(uTime * (1.5 + 3.0 * h) + h * 90.0);
        c += mix(vec3(0.8, 0.86, 1.0), vec3(1.0, 0.92, 0.78), h) * s * tw * (k == 0 ? 0.8 : 1.6) * smoothstep(0.04, 0.25, y);
      }
      // luna (lo caro solo donde se ve)
      vec2 m = vec2(0.66, 0.6) * asp;
      float d = length(p - m), R = 0.034;
      float disk = 1.0 - smoothstep(R - 0.0012, R, d);
      if (disk > 0.0) {
        vec3 moon = vec3(1.0, 0.97, 0.9) * (0.8 + 0.28 * smoothstep(0.35, 0.7, dkFbm(vec3((p - m) * 40.0, 1.0))));
        c = mix(c, moon * 1.5 * (1.0 - 0.25 * smoothstep(R * 0.3, R, d)), disk);
      }
      c += vec3(0.75, 0.82, 1.0) * 0.45 * exp(-max(d - R, 0.0) / 0.018) * (1.0 - disk);
      c += vec3(0.3, 0.38, 0.75) * 0.22 * exp(-d / 0.16);
      if (y > 0.1 && y < 0.8) {
        float n = dkFbm(vec3(p * vec2(1.6, 6.0) + vec2(uTime * 0.012, 0.0), 4.0 + uTime * 0.01));
        float cloud = smoothstep(0.5, 0.82, n) * smoothstep(0.1, 0.3, y) * (1.0 - smoothstep(0.55, 0.8, y));
        c = mix(c, vec3(0.07, 0.08, 0.17) + vec3(0.5, 0.58, 0.9) * exp(-d / 0.22) * 0.55, cloud * 0.75);
      }
      c += vec3(0.55, 0.6, 0.95) * uFlash * 0.22 * exp(-y * 2.0);
      gl_FragColor = vec4(c, 1.0);
    }`,
}));
sky.position.set(0, SKY_Y, SKY_Z);
scene.add(sky);

// ---------- horizonte pintado: colinas y árboles en silueta, con un pueblo encendido a lo lejos ----------
// Pintar en un lienzo da mucho detalle por casi nada: la carroza pinta así su castillo (ejemplos/carroza-encantada).
function paintHorizon() {
  const W = 2048, H = 512, c = canvas(W, H), g = c.getContext("2d"), r = rng(7);
  const ridge = (base, amp, freq, seed) => (x) => base - amp * (0.55 + 0.3 * Math.sin(x * freq + seed) + 0.15 * Math.sin(x * freq * 2.9 + seed * 3));
  const fill = (top, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, H); for (let x = 0; x <= W; x += 6) g.lineTo(x, top(x)); g.lineTo(W, H); g.fill(); };
  const far = ridge(H * 0.5, 120, 0.0031, 1.3);
  fill(far, "#1a2257");
  // ventanas cálidas sobre la colina lejana
  for (let k = 0; k < 26; k++) {
    const x = W * (0.3 + 0.4 * r()), y = far(x) + 10 + r() * 40;
    const gl = g.createRadialGradient(x, y, 0, x, y, 9);
    gl.addColorStop(0, "rgba(255,214,150,0.9)"); gl.addColorStop(1, "rgba(255,190,110,0)");
    g.fillStyle = gl; g.fillRect(x - 9, y - 9, 18, 18);
    g.fillStyle = "#ffe2a8"; g.fillRect(x - 1.5, y - 2, 3, 4);
  }
  // línea de árboles: copas redondas y algún pino, de atrás hacia adelante
  const near = ridge(H * 0.66, 40, 0.006, 4.1);
  for (let pass = 0; pass < 2; pass++) {
    g.fillStyle = pass ? "#0a0d24" : "#10153a";
    for (let x = -20; x < W + 20; x += 9 + r() * 14) {
      const y = near(x) - pass * 14 - r() * 18, s = 14 + r() * 22;
      g.beginPath();
      if (r() < 0.25) { g.moveTo(x - s * 0.6, y + s); g.lineTo(x, y - s * 1.6); g.lineTo(x + s * 0.6, y + s); }
      else g.arc(x, y, s, 0, Math.PI * 2);
      g.fill();
    }
  }
  fill((x) => near(x) + 10, "#0a0d24");
  return c;
}
lienzos.horizonte = paintHorizon();
const HZ_W = 28, HZ_H = HZ_W / 4;
const horizon = new THREE.Mesh(new THREE.PlaneGeometry(HZ_W, HZ_H), new THREE.MeshBasicMaterial({ map: tex(lienzos.horizonte, true), transparent: true, depthWrite: false, fog: false }));
horizon.position.set(0, HZ_H / 2 - 1.6, -12.5);
scene.add(horizon);

// ---------- suelo mojado con reflejo ----------
// Sin MSAA y a escala de la pantalla (lo ajusta resize). Se dibuja fuera del render principal (renderFrame).
const mirror = new Reflector(new THREE.PlaneGeometry(30, 30), { textureWidth: 512, textureHeight: 512, color: 0x8a94b8, multisample: 0 });
mirror.rotation.x = -Math.PI / 2;
mirror.position.set(0, 0, -9);
scene.add(mirror);
const renderMirror = mirror.onBeforeRender;
mirror.onBeforeRender = () => {};
const groundU = { uMagicPos: { value: new THREE.Vector3() }, uMagic: { value: 0 } };
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShaderMaterial({
  uniforms: groundU, transparent: true, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: NOISE_GLSL + /* glsl */ `
    varying vec3 vW; uniform vec3 uMagicPos; uniform float uMagic;
    vec2 h2(vec2 p){ p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
    void main(){
      vec2 p = vW.xz;
      // camino y plaza de adoquín bajo el héroe, pasto fuera y un borde de piedra clara entre los dos
      float path = (1.0 - smoothstep(0.82, 0.92, abs(p.x))) * step(p.y, 3.5);
      float plaza = max(path, 1.0 - smoothstep(1.62, 1.72, length(p)));
      float border = max(exp(-pow((abs(p.x) - 0.87) / 0.03, 2.0)) * step(1.67, length(p)), exp(-pow((length(p) - 1.67) / 0.03, 2.0)) * step(0.92, abs(p.x)));
      float gap = 0.0; vec3 stoneCol = vec3(0.0), grass = vec3(0.0);
      if (plaza > 0.0) {
        // adoquines de Voronoi: la junta oscura tapa el reflejo, la piedra lo deja ver a medias
        vec2 g = p * 5.2; vec2 i = floor(g), f = fract(g);
        float d1 = 8.0, d2 = 8.0; vec2 id = vec2(0.0);
        for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
          vec2 o = vec2(float(x), float(y)); vec2 rr = o + 0.15 + h2(i + o) * 0.7 - f; float d = dot(rr, rr);
          if (d < d1) { d2 = d1; d1 = d; id = i + o; } else if (d < d2) d2 = d;
        }
        gap = 1.0 - smoothstep(0.05, 0.13, sqrt(d2) - sqrt(d1));
        vec3 stone = mix(vec3(0.10, 0.11, 0.17), vec3(0.19, 0.2, 0.27), h2(id).x) * (0.85 + 0.3 * dkNoise(vec3(p * 30.0, 2.0)));
        stoneCol = mix(stone, vec3(0.015, 0.015, 0.025), gap);
      }
      if (plaza < 1.0) grass = mix(vec3(0.012, 0.035, 0.03), vec3(0.03, 0.075, 0.05), dkFbm(vec3(p * 5.0, 1.0)));
      vec3 col = mix(grass, stoneCol, plaza);
      col = mix(col, vec3(0.42, 0.36, 0.26), border * 0.6);
      float alpha = mix(1.0, mix(mix(0.55, 0.85, smoothstep(-2.0, 2.5, p.y)), 0.97, gap), plaza);
      vec3 light = vec3(0.32, 0.38, 0.62) * 0.75;
      vec2 dm = p - uMagicPos.xz; light += vec3(1.0, 0.86, 0.62) * uMagic * exp(-dot(dm, dm) / 1.1);
      col *= light;
      float far = smoothstep(3.0, 11.0, -p.y);
      gl_FragColor = vec4(mix(col, vec3(0.006, 0.008, 0.026), far * 0.9), mix(alpha, 1.0, far * 0.6));
    }`,
}));
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0.002, -9);
ground.renderOrder = 1;
ground.layers.set(1);   // pegado al suelo: desde abajo se ve de canto, no hace falta en el reflejo
scene.add(ground);

// ---------- niebla baja: esconde la costura del horizonte y da profundidad ----------
function fogPlane(w, h, color, strength, speed, seed) {
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uFlash: { value: 0 } }, transparent: true, depthWrite: false, fog: false,
    vertexShader: PLAIN_VERT,
    fragmentShader: NOISE_GLSL + /* glsl */ `
      varying vec2 vUv; uniform float uTime, uFlash;
      void main(){
        float env = smoothstep(0.0, 0.25, vUv.y) * (1.0 - smoothstep(0.3, 1.0, vUv.y)) * smoothstep(0.0, 0.15, vUv.x) * (1.0 - smoothstep(0.85, 1.0, vUv.x));
        if (env < 0.002) discard;   // lo caro solo donde hay niebla
        float n = dkFbm(vec3(vUv * vec2(${(w * 0.5).toFixed(2)}, ${(h * 1.2).toFixed(2)}) + vec2(uTime * ${speed.toFixed(3)}, 0.0), ${seed.toFixed(1)} + uTime * 0.04));
        float a = smoothstep(0.28, 0.8, n) * env;
        gl_FragColor = vec4(vec3(${color.join(",")}) * (1.0 + uFlash * 1.5), a * ${strength.toFixed(2)});
      }`,
  });
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
}
const fogs = [
  [fogPlane(22, 3.2, [0.3, 0.36, 0.62], 0.75, 0.02, 1), [0, 0.6, -11.5]],

// ---------- mallas combinadas: una sola llamada de dibujo para muchas piezas ----------
// Cada bloque guarda el instante en que aparece; revealUntil dibuja solo los que ya tocan.
// Así cada pieza se "dibuja con luz" a su ritmo sin pagar una llamada de dibujo por pieza.
function mergeParts(parts) {
  const P = [], N = [], UV = [], C = [], blocks = [];
  const colored = parts.some((q) => q.color);
  let base = 0;
  for (const { geo, matrix, key = -1, when, color } of parts) {
    const g = matrix ? geo.clone().applyMatrix4(matrix) : geo;
    const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
    const idx = g.index ? g.index.array : Array.from({ length: pos.count }, (_, i) => i);
    for (let i = 0; i < pos.count; i++) {
      P.push(pos.getX(i), pos.getY(i), pos.getZ(i));
      N.push(nor.getX(i), nor.getY(i), nor.getZ(i));
      UV.push(uv ? uv.getX(i) : 0, uv ? uv.getY(i) : 0);
      if (colored) C.push(...(color ?? [1, 1, 1]));
    }
    if (when) { const Q = idx.length / 6; for (let q = 0; q < Q; q++) blocks.push([when(q, Q), base, idx, q * 6, 6]); }
    else blocks.push([key, base, idx, 0, idx.length]);
    base += pos.count;
  }
  blocks.sort((a, b) => a[0] - b[0]);
  const I = [], keys = [], ends = [];
  for (const [k, b0, idx, s0, n] of blocks) { for (let j = 0; j < n; j++) I.push(idx[s0 + j] + b0); keys.push(k); ends.push(I.length); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(P, 3));
  geo.setAttribute("normal", new THREE.Float32BufferAttribute(N, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(UV, 2));
  if (colored) geo.setAttribute("color", new THREE.Float32BufferAttribute(C, 3));
  geo.setIndex(I);
  geo.userData = { keys: Float32Array.from(keys), ends: Uint32Array.from(ends) };
  geo.computeBoundingSphere();
  return geo;
}
function revealUntil(mesh, S) {
  const { keys, ends } = mesh.geometry.userData;
  let lo = 0, hi = keys.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (keys[mid] <= S) lo = mid + 1; else hi = mid; }
  const n = lo ? ends[lo - 1] : 0;
  mesh.geometry.setDrawRange(0, n); mesh.visible = n > 0;
}
const meshMatrix = (pos, rot = [0, 0, 0], scale = 1) => new THREE.Matrix4().compose(new THREE.Vector3(...pos), new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)), new THREE.Vector3(scale, scale, scale));

const tubeGeo = (curve, segs, radius, radial = 6) => new THREE.TubeGeometry(typeof curve === "function" ? new FnCurve(curve) : curve, segs, radius, radial, false);
// instante en que aparece cada tramo de un tubo que se dibuja entre t0 y t1 (con la inversa de su curva de ease)
const easeInOutSineInv = (y) => Math.acos(1 - 2 * y) / Math.PI;
const drawn = (t0, t1, inv = (y) => y) => (q, Q) => t0 + (t1 - t0) * inv((q + 1) / Q);
// espiral 2D: centro, radio inicial y final, ángulo inicial y vueltas (positivas = contra reloj)

{

  for (let k = 0; k < 12; k++) {

// ---------- partículas: estela de la varita, estallido, luciérnagas y destellos ----------

{

const pU = { uS: { value: 0 }, uA: { value: 0 }, uHead: { value: 0 }, uPR: { value: renderer.getPixelRatio() }, uCenter: { value: HERO.clone() }, uSpark: { value: 0 } };
const points = new THREE.Points(pGeo, new THREE.ShaderMaterial({
  uniforms: pU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  vertexShader: /* glsl */ `
    attribute vec4 aRand; attribute float aKind; attribute vec3 aBase;
    uniform float uS, uA, uHead, uPR, uSpark; uniform vec3 uCenter;

    // la varita entra desde arriba a la izquierda y envuelve al héroe en espiral

// ---------- línea de tiempo ----------
// S: segundos de la secuencia (se reinicia al tocar). A: reloj ambiente que nunca se detiene:
// todo lo que debe seguir vivo al terminar (partículas, brillos, cámara) se mueve con A.
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const camIdle = { p: V(0, 1.05, 3.0), l: V(0, 0.95, 0) };
const camMagic = { p: V(-0.25, 1.15, 2.8), l: V(0, 1.0, 0) };
const camEnd = { p: V(0.3, 1.2, 4.1), l: V(0, 1.15, 0) };
const tmpP = new THREE.Vector3(), tmpL = new THREE.Vector3();

function update(S, A) {
  // cámara
  const km = easeInOutSine(seg(S, TAP, FLASH)), ke = easeInOutCubic(seg(S, FLASH + 0.1, FLASH + 1.9));
  tmpP.lerpVectors(camIdle.p, camMagic.p, km).lerp(camEnd.p, ke);
  tmpL.lerpVectors(camIdle.l, camMagic.l, km).lerp(camEnd.l, ke);
  const flash = pulse(S, FLASH, 0.1);
  tmpP.x += 0.05 * Math.sin(A * 0.23) + 0.03 * flash * Math.sin(A * 83);
  tmpP.y += 0.025 * Math.sin(A * 0.31) + 0.03 * flash * Math.sin(A * 71);
  camera.position.copy(tmpP); camera.lookAt(tmpL);
  if (params.get("cam") === "side") { camera.position.set(3.2, 1.1, 0.2); camera.lookAt(0, 1.0, 0); }   // para revisar que nada atraviese nada
  camera.updateMatrixWorld();

  // HÉROE: la esfera respira, se carga de luz y se apaga en el destello; el medallón se dibuja con luz
  const glow = (0.1 + 0.07 * Math.sin(A * 2.2) + 1.2 * easeInCubic(seg(S, TAP + 0.3, FLASH))) * (1 - seg(S, FLASH - 0.05, FLASH + 0.1));
  orbMat.color.setRGB(1.0, 0.78, 0.5).multiplyScalar(1.5 + 1.6 * glow);   // siempre sobre el umbral del bloom, o el halo parpadea
  orb.scale.setScalar(Math.max(0.001, (1 + 0.04 * Math.sin(A * 2.2)) * (1 - seg(S, FLASH - 0.05, FLASH + 0.08))));
  revealUntil(medalGold, S);
  revealUntil(medalGem, S);
  const after = seg(S, FLASH + 1.0, FLASH + 2.0);
  medallion.position.y = HERO.y + 0.02 * Math.sin(A * 1.3) * after;
  medallion.rotation.y = 0.15 * Math.sin(A * 0.4) * after;
  goldMat.emissiveIntensity = 0.12 + 1.1 * pulse(S, FLASH + 0.6, 0.4);

  // luz mágica y charco de luz en el suelo
  magicLight.intensity = 0.4 + 3.5 * glow + 8 * flash + 1.2 * seg(S, FLASH, FLASH + 1);
  groundU.uMagicPos.value.copy(HERO);
  groundU.uMagic.value = 0.25 * glow + 1.6 * flash + 0.35 * seg(S, FLASH, FLASH + 1);
  skyU.uTime.value = A; skyU.uFlash.value = 0.6 * flash + 0.3 * glow;
  for (const [m] of fogs) { m.material.uniforms.uTime.value = A; m.material.uniforms.uFlash.value = 0.4 * flash + 0.15 * glow; }

  // partículas
  pU.uS.value = S; pU.uA.value = A;
  pU.uHead.value = 1.18 * easeInOutSine(seg(S, TAP + 0.05, FLASH - 0.2));
  pU.uSpark.value = seg(S, FLASH + 1.2, FLASH + 1.8);

  bloom.strength = 0.6 + 0.25 * flash + 0.1 * glow;
  renderer.toneMappingExposure = 1.0 + 0.1 * flash;

  // textos: todo lo que se mueve va por transform u opacity, y solo se escribe lo que cambia
  const idleIn = seg(S, 0.1, 0.8), gone = 1 - seg(S, TAP, TAP + 0.45);
  setStyle(ui.intro, "opacity", f3(idleIn * gone));
  setStyle(ui.intro, "transform", `translateY(${f3((1 - idleIn) * 1.2)}cqh)`);
  const hintOp = f3(seg(S, 0.35, 0.9) * gone);
  setStyle(ui.hint, "opacity", hintOp);
  if (hintOp > 0) setStyle(ui.hint, "transform", `scale(${f3(1 + 0.025 * Math.sin(A * 3.2))})`);
  const ringK = (A * 0.7) % 1, rp = seg(S, TAP, TAP + 0.7);
  const ringOp = f3(seg(S, 0.4, 0.9) * gone * (1 - ringK) * 0.8), ripOp = f3(S >= TAP ? 1 - rp : 0);
  if (ringOp > 0 || ripOp > 0) {
    const [sx, sy] = screenOf(HERO), at = `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) translate(-50%, -50%)`;
    if (ringOp > 0) setStyle(ui.ring, "transform", `${at} scale(${f3((0.2 + 0.12 * ringK) / 0.26)})`);
    if (ripOp > 0) setStyle(ui.ripple, "transform", `${at} scale(${f3((0.04 + 0.4 * easeOutCubic(rp)) / 0.44)})`);
  }
  setStyle(ui.ring, "opacity", ringOp);
  setStyle(ui.ripple, "opacity", ripOp);

  const T0 = FLASH + 1.2;   // arranque del título
  setStyle(ui.title, "opacity", f3(seg(S, T0, T0 + 0.55)));
  setStyle(xv, "opacity", f3(seg(S, T0, T0 + 0.55)));
  const spread = f3(0.45 * (1 - easeOutCubic(seg(S, T0, T0 + 0.85))));
  if (spread !== xvSpread) {
    xvSpread = spread;
    xvLetters.forEach((el, i) => { el.style.transform = spread ? `translateX(${f3((i - (xvLetters.length - 1) / 2) * spread)}em)` : ""; });
  }
  const np = easeInOutSine(seg(S, T0 + 0.25, T0 + 1.15)), edge = np * 135 - 20;
  const mask = np < 1 ? `linear-gradient(90deg, #000 ${f3(edge - 15)}%, transparent ${f3(edge + 15)}%)` : "none";
  setStyle(nameBox, "webkitMaskImage", mask); setStyle(nameBox, "maskImage", mask);
  setStyle(nameBox, "transform", `translateY(${f3((1 - np) * 0.8)}cqh)`);
  if (np > 0) setStyle(nameGold, "backgroundPosition", `${f3(100 - (((Math.max(S, T0 + 0.25) - T0 - 0.25) * 32) % 140))}% 0`);
  setStyle(lineEl, "transform", `scaleX(${f3(easeInOutCubic(seg(S, T0 + 0.75, T0 + 1.35)))})`);
  setStyle(subEl, "opacity", f3(seg(S, T0 + 1.0, T0 + 1.55)));
  setStyle(subEl, "transform", `translateY(${f3((1 - easeOutCubic(seg(S, T0 + 1.0, T0 + 1.55))) * 1.2)}cqh)`);
}

// ---------- bucle ----------
// Sin ?auto la escena espera el toque. Con ?auto arranca sola (para enlaces y videos).
let playing = params.has("auto"), ready = false;
let t0 = performance.now(), playStart = t0;
frame.addEventListener("click", () => {
  if (frozenT !== null || !ready) return;
  const S = (performance.now() - playStart) / 1000;
  if (!playing || S > DURATION + 1) { playing = true; playStart = performance.now() - TAP * 1000; }
});
// ?hide=points,sky… oculta piezas para medir cuánto cuestan
const DEBUG_HIDE = { points, sky, horizon, ground, mirror, orb, medallion, fogs: fogs.map(([m]) => m) };
for (const k of (params.get("hide") ?? "").split(",")) for (const o of [].concat(DEBUG_HIDE[k] ?? [])) { o.visible = false; debugHidden.add(o); }

// ---------- calidad adaptable ----------
// Si el equipo no sostiene 60 cuadros por segundo, baja en pasos pequeños: primero la resolución del reflejo,
// luego la del render. Antes de bajar mira dónde está el límite: si nuestro JS (update + enviar el render) se come
// casi todo el cuadro, es el procesador y bajar la resolución no ayudaría; entonces el reflejo pasa a cuadro por medio.
// No compara "antes y después" de bajar: la escena cuesta distinto en cada momento de la animación y engaña.
const LEVELS = [[1, 0.75], [1, 0.5], [0.85, 0.5], [0.72, 0.45], [0.6, 0.4], [0.5, 0.35]];
let level = 0;
function applyLevel(i) {
  level = i;
  const pr = Math.max(Math.min(0.75, MAX_PR), MAX_PR * LEVELS[i][0]);
  reflScale = LEVELS[i][1];
  renderer.setPixelRatio(pr); composer.setPixelRatio(pr);
  pU.uPR.value = pr;
  resize();
}
const perf = { dts: [], cpu: 0, sum: 0, good: 0, settle: 0, upAt: -1e9, noUp: 0 };
function watchPerf(now, dt, cpu) {
  if (frozenT !== null || params.has("fixed") || document.hidden || dt > 1000 || now < perf.settle) return;
  perf.dts.push(dt); perf.cpu += cpu; perf.sum += dt;
  if (perf.dts.length < 8 || (perf.dts.length < 40 && perf.sum < 1000)) return;
  const sorted = perf.dts.sort((a, b) => a - b), cpuMean = perf.cpu / sorted.length;
  perf.dts = []; perf.cpu = 0; perf.sum = 0;
  if (sorted[0] > 28 && sorted[sorted.length - 1] < 38) return;   // 30 Hz exactos: ahorro de batería, no la GPU
  const keep = sorted.slice(0, Math.ceil(sorted.length * 0.95)), mean = keep.reduce((a, b) => a + b, 0) / keep.length;
  const target = 1000 / 60;
  if (mean > target * 1.12) {
    perf.good = 0;
    if (cpuMean > mean * 0.7 && mirrorEvery === 1) { mirrorEvery = 2; perf.settle = now + 600; return; }
    if (now - perf.upAt < 2500) perf.noUp = now + 30000;
    if (level < LEVELS.length - 1) { applyLevel(Math.min(LEVELS.length - 1, level + (mean > target * 2.2 ? 2 : 1))); perf.settle = now + 600; }
  } else if (mean < target * 1.04) {
    if (++perf.good >= 8 && level > 0 && now > perf.noUp) { perf.good = 0; perf.upAt = now; applyLevel(level - 1); perf.settle = now + 600; }
  } else perf.good = 0;
}

// ---------- arranque ----------
// Antes de mostrar nada: todas las texturas en la GPU y todos los shaders compilados tal como se dibujan
// (dentro de los buffers del posproceso). Así nada tironea a medio camino la primera vez que aparece.
async function warmUp() {
  for (const t of allTextures) renderer.initTexture(t);
  const hidden = [];
  scene.traverse((o) => { if (!o.visible) { hidden.push(o); o.visible = true; } });
  renderer.setRenderTarget(composer.renderTarget1);
  await renderer.compileAsync(scene, camera);
  renderer.setRenderTarget(null);
  renderFrame();
  for (const o of hidden) o.visible = false;
  update(0, 0); renderFrame();
}
if (frozenT !== null) frame.classList.add("ready", "instant");
await warmUp();
// los lienzos grandes ya están en la GPU: se liberan para no ocupar memoria del teléfono
if (frozenT === null) for (const c of Object.values(lienzos)) { c.width = 1; c.height = 1; }

// ganchos para las herramientas (scripts/): capturar, grabar y medir
window.__setT = (t) => { update(t, t); renderFrame(); };
window.__bench = (t, n = 90) => {
  const gl = renderer.getContext(), px = new Uint8Array(4);
  const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  update(t, t); renderFrame(); sync();
  let cpu = 0;
  const t1 = performance.now();
  for (let i = 0; i < n; i++) { const a = performance.now(); update(t + i / 600, t + i / 600); cpu += performance.now() - a; renderFrame(); }
  sync();
  return { frame: (performance.now() - t1) / n, update: cpu / n };
};
window.__parts = { points, sky, horizon, ground, mirror, orb, medallion, fogs: fogs.map(([m]) => m), bloom };
window.__info = (t) => { renderer.info.autoReset = false; renderer.info.reset(); update(t, t); renderFrame(); const r = { ...renderer.info.render }; renderer.info.autoReset = true; return r; };
window.__programs = () => renderer.info.programs.map((pr) => pr.name + " #" + pr.id);
window.__quality = () => ({ level, pixelRatio: renderer.getPixelRatio(), reflScale, mirrorEvery });
window.__tiempos = { TAP, FLASH, DURATION };

let last = 0, cpuLast = 0;
function loop(now) {
  if (frozenT !== null) { update(frozenT, frozenT); renderFrame(); return; }
  watchPerf(now, last ? now - last : 16.7, cpuLast); last = now;
  const S = playing ? (now - playStart) / 1000 : Math.min((now - t0) / 1000, 0.95);
  update(S, now / 1000);
  renderFrame();
  cpuLast = performance.now() - now;
  requestAnimationFrame(loop);
}
ready = true;
frame.classList.add("ready");
t0 = playStart = performance.now();
perf.settle = t0 + 1500;
requestAnimationFrame(loop);
</script>
</body>
</html>
