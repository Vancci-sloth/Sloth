<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Laboratorio de montaje · Motion Graphics</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}#stage{background:#111;color:#fafafa}
.escena{position:absolute;inset:0;overflow:hidden}.espacio{perspective:1100px;perspective-origin:50% 50%}
#mundo{position:absolute;inset:0;transform-style:preserve-3d}
.album{position:absolute;width:320px;height:380px;left:800px;top:350px;border-radius:12px;overflow:hidden;backface-visibility:hidden;will-change:transform;box-shadow:0 24px 40px #0005;background:var(--fondo);color:var(--tinta)}
.album:before{content:"";position:absolute;width:260px;height:260px;border:40px solid currentColor;border-radius:50%;left:30px;top:20px;opacity:.8}
.album:nth-child(2n):before{border-radius:12%;transform:rotate(35deg);border-width:25px}
.album:after{content:attr(data-nombre);position:absolute;left:24px;bottom:25px;font-size:37px;letter-spacing:-2px;font-weight:900}
.rotulo{position:absolute;left:100px;top:75px;font-size:20px;letter-spacing:5px;font-weight:700}
#titular{position:absolute;left:105px;top:160px;font-size:125px;line-height:.9;letter-spacing:-8px;font-weight:900;width:1100px}
#tipografia{background:#deded6;color:#121212;display:flex;flex-direction:column;justify-content:center;padding:90px}
.mascara{overflow:hidden;height:240px}.palabra{font-size:240px;line-height:1;font-weight:900;letter-spacing:-15px}
.palabra:last-child{color:#6750eb}#mosaico{background:#17151c}
.pieza{position:absolute;width:290px;height:290px;left:815px;top:395px;border-radius:10px;background:var(--fondo);color:var(--tinta);display:grid;place-items:center;font-size:125px;font-weight:900;box-shadow:0 12px 28px #0005}
#cierre{position:absolute;inset:0;display:grid;place-content:center;background:#deded6;color:#111;text-align:center}
#cierre strong{font-size:150px;letter-spacing:-8px}#cierre small{margin-top:25px;font-size:24px;letter-spacing:5px}
</style>
<div id="stage">
  <section id="galeria" class="escena espacio"><div id="mundo"></div><div class="rotulo">EXPLORA / ELIGE / ESCUCHA</div><div id="titular">Encuentra<br>tu sonido.</div></section>
  <section id="tipografia" class="escena"><div class="mascara"><div class="palabra">SIGUE</div></div><div class="mascara"><div class="palabra">EL RITMO.</div></div></section>
  <section id="mosaico" class="escena"></section>
  <section id="cierre"><strong>Tu próximo ritmo.</strong><small>ESTUDIO DE MOVIMIENTO · SIN AUDIO</small></section>
</div>
<script src="../referencias/motion-agent/runtime/mg-runtime.js"></script>
<script>
// Colores de este laboratorio, no identidad de una marca ni paleta de la app.
const colores=[['#b8ee72','#23351b'],['#6750eb','#e3dfff'],['#e48255','#4a2015'],['#e2ded3','#303025'],['#547fbe','#d3e6ff'],['#b5a5d3','#312449']];
const nombres=['ÓRBITA','NOCHE','PULSO','AIRE','RUTA','ECO'];
const mundo=document.querySelector('#mundo'), mosaico=document.querySelector('#mosaico');
const albums=colores.map((c,i)=>{const el=document.createElement('div');el.className='album';el.dataset.nombre=nombres[i];el.style.setProperty('--fondo',c[0]);el.style.setProperty('--tinta',c[1]);mundo.append(el);return el});
const piezas=Array.from({length:12},(_,i)=>{const el=document.createElement('div');el.className='pieza';el.textContent=['◯','Ⅱ','↗','≋'][i%4];el.style.setProperty('--fondo',colores[i%6][0]);el.style.setProperty('--tinta',colores[i%6][1]);mosaico.append(el);return el});
const galeria=document.querySelector('#galeria'), tipo=document.querySelector('#tipografia'), cierre=document.querySelector('#cierre');
const palabras=[...document.querySelectorAll('.palabra')], titular=document.querySelector('#titular');
const fase=(t,a,b)=>MG.ease.inOut3(MG.seg(t,a,b));
MG.register({duration:8,fps:60,width:1920,height:1080,render(t){
  // Valores absolutos: saltar atrás produce exactamente el mismo cuadro.
  galeria.style.visibility=t<3.1?'visible':'hidden';
  tipo.style.visibility=t>=2.6&&t<5.1?'visible':'hidden';
  mosaico.style.visibility=t>=4.7&&t<7.2?'visible':'hidden';
  cierre.style.visibility=t>=6.8?'visible':'hidden';
  const viaje=fase(t,0,1.5), acercar=fase(t,1.5,2.9);
  mundo.style.transform=`translate3d(${-110*viaje}px,${-45*viaje}px,${180*acercar}px)`;
  albums.forEach((el,i)=>{
    const x=(i-2)*330, y=(i%2)*160-60, z=-Math.abs(i-2)*120;
    const elegido=i===2;
    el.style.transform=`translate3d(${MG.lerp(x,elegido?110:x*2,acercar)}px,${MG.lerp(y,elegido?-30:y*2,acercar)}px,${MG.lerp(z,elegido?180:-600,acercar)}px) rotateY(${MG.lerp(-28,elegido?0:-45,acercar)}deg) rotateZ(${MG.lerp((i-2)*3,0,acercar)}deg)`;
    // Conserva el mismo modo de composición alfa al volver al inicio.
    el.style.opacity=String(elegido?.999:.999-acercar*.7);
  });
  titular.style.transform=`translateY(${MG.lerp(50,0,MG.ease.out3(MG.seg(t,0,.65)))}px)`;
  titular.style.opacity=String(1-MG.seg(t,1.35,1.9));
  tipo.style.clipPath=`inset(0 ${100*(1-fase(t,2.6,3.1))}% 0 0)`;
  palabras.forEach((el,i)=>{const p=MG.ease.out4(MG.seg(t,2.8+i*.13,3.55+i*.13));el.style.transform=`translateY(${(1-p)*250}px) translateX(${-180*fase(t,4.25,4.9)}px)`});
  mosaico.style.clipPath=`inset(${100*(1-fase(t,4.7,5.15))}% 0 0 0)`;
  piezas.forEach((el,i)=>{
    const p=fase(t,4.8+i*.025,5.8+i*.025);
    const x=(i%4-1.5)*370,y=(Math.floor(i/4)-1)*320;
    el.style.transform=`translate(${x*p}px,${y*p}px) rotate(${(1-p)*(i-6)*13}deg) scale(${MG.lerp(.2,1,p)})`;
  });
  cierre.style.clipPath=`circle(${100*fase(t,6.8,7.3)}% at 50% 50%)`;
}});
</script>
</html>
