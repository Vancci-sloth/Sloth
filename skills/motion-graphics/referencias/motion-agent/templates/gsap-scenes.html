<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plantilla · GSAP por escenas</title>
<link rel="stylesheet" href="../runtime/fonts/fonts.css">
<style>
  :root{--bg:#090a0f;--text:#f3f4f6;--muted:#9ca3af;--accent:#00f0ff;--font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  #stage{background:var(--bg);color:var(--text);font-family:var(--font)}
  #world{position:absolute;inset:0;transform-origin:50% 50%}   /* cámara virtual: se anima este contenedor */
  .scene{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:28px;visibility:hidden}
  .badge{font-size:26px;font-weight:600;color:var(--accent);border:2px solid var(--accent);padding:10px 28px;border-radius:999px;letter-spacing:.08em}
  .title{font-size:120px;font-weight:800;letter-spacing:-.03em;line-height:1.05;text-align:center;max-width:1500px}
  .title b{color:var(--accent)}
  .sub{font-size:42px;color:var(--muted);text-align:center;max-width:1100px;line-height:1.35}
</style>
</head>
<body>
<div id="stage"><div id="world">
  <section class="scene" id="a"><div class="badge" id="a-b">PLANTILLA</div><h1 class="title" id="a-t">Animación como <b>función del tiempo</b></h1><p class="sub" id="a-s">Misma entrada, mismo fotograma.</p></section>
  <section class="scene" id="b"><h2 class="title" id="b-t">Listo para <b>renderizar</b></h2></section>
</div></div>

<script src="../runtime/vendor/gsap-3.12.5.min.js"></script>
<script src="../runtime/mg-runtime.js"></script>
<script>
  // Reglas: timeline finita y pausada · SIEMPRE fromTo (estado inicial explícito) · sin repeat:-1 · sin random.
  const D = 8;
  const tl = gsap.timeline({ paused: true });

  // Escena A (0–3.6)
  tl.set('#a', { visibility: 'visible' }, 0);
  tl.fromTo('#a-b', { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: 'back.out(1.7)' }, 0.2);
  tl.fromTo('#a-t', { y: 50, autoAlpha: 0, filter: 'blur(16px)' }, { y: 0, autoAlpha: 1, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, 0.4);
  tl.fromTo('#a-s', { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: 'power2.out' }, 0.7);
  tl.to('#a', { y: -60, autoAlpha: 0, duration: 0.35, ease: 'power2.in' }, 3.2);      // las salidas son más rápidas que las entradas
  tl.set('#a', { visibility: 'hidden' }, 3.6);

  // Escena B (3.5–8) + movimiento de cámara
  tl.set('#b', { visibility: 'visible' }, 3.5);
  tl.fromTo('#world', { scale: 0.94 }, { scale: 1, duration: 0.8, ease: 'power3.out' }, 3.5);
  tl.fromTo('#b-t', { scale: 0.85, autoAlpha: 0, filter: 'blur(18px)' }, { scale: 1, autoAlpha: 1, filter: 'blur(0px)', duration: 0.6, ease: 'power4.out' }, 3.6);
  tl.to({}, { duration: 0.001 }, D);   // fija la duración total de la timeline

  MG.register({ duration: D, fps: 60, width: 1920, height: 1080, render: MG.fromGsap(tl) });
</script>
</body>
</html>
