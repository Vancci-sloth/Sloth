<!doctype html>
<!--
  La guía de lo nuevo de la 0.4.2: sale una vez al abrir Sloth después de actualizar (web/src/Novedades.tsx, en un
  iframe), y también se abre sola en un navegador. Una página suelta, sin dependencias: el logo (web/public/icon.svg) va
  adentro, en #cara. Ocho escenas (el concierto, cinco novedades, los arreglos y el final, que es el mismo concierto); cada una tiene su guion en
  `guiones`, y «Siguiente», las flechas o deslizar pasan de una a otra. Con ?escena=N abre directo en una.
  Para la de otra versión: cambia sus escenas 1 a 6, el número (título, cabecera y el del escenario de la escena 0; la pantalla del final lo toma del título) y la
  canción (YT_ID y la tarjeta #sonando); baile.webm es el video del creador bailando, recortado.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sloth 0.4.2</title>
<style>
  /* Paleta de Sloth (web/src/styles.css) y la crema del logo. */
  :root {
    --bg: #0f0e0c; --panel: #171512; --panel-2: #221f1b; --line: #2e2a24; --text: #ede6d6; --muted: #9a907f;
    --amber: #e8a33d; --amber-2: #f4b04a; --sobre-ambar: #1b1408; --ok: #8fc177; --bad: #e06c55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; overflow: hidden; color: var(--text); font-family: Inter, 'Segoe UI', system-ui, sans-serif; }
  .escenario { position: relative; width: min(100vw, 100vh); max-width: 1080px; aspect-ratio: 1; user-select: none; -webkit-user-select: none; }
  .escenario > svg, .escenario > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  canvas { pointer-events: none; }
  .controles { position: absolute; left: 8.33%; right: 8.33%; bottom: 3.2%; display: flex; align-items: center; gap: 12px; font-size: clamp(12px, 1.85vmin, 20px); }
  .controles button { font: inherit; font-weight: 700; border-radius: 12px; padding: .8em 1.25em; cursor: pointer; border: 2px solid var(--line); background: var(--panel); color: var(--text); display: inline-flex; align-items: center; gap: .55em; transition: transform .12s, background-color .2s, border-color .2s, opacity .3s; }
  .controles button:hover { border-color: var(--muted); }
  .controles button:active { transform: scale(.95); }
  .controles button:focus-visible { outline: 3px solid var(--amber-2); outline-offset: 3px; }
  .controles svg { width: 1.25em; height: 1.25em; }
  #siguiente { margin-left: auto; background: var(--amber); border-color: var(--amber); color: var(--sobre-ambar); }
  #siguiente:hover { background: var(--amber-2); border-color: var(--amber-2); }
  #anterior.oculto { opacity: 0; pointer-events: none; }
  #cuenta { flex: 1; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }

  .a { transform-box: fill-box; transform-origin: center; }
  .izq { transform-box: fill-box; transform-origin: 0 50%; }
  .abajo { transform-box: fill-box; transform-origin: 50% 100%; }
  .arriba { transform-box: fill-box; transform-origin: 50% 0; }
  .escena { display: none; }
  .escena.visible { display: inline; }
  #rayos { transition: opacity .9s; }
  #brillo stop { transition: stop-color 1s; }
  .num { font-variant-numeric: tabular-nums; }

  /* Lo que se mueve siempre: el idol baila y los rayos giran. */
  .gira { animation: girar 40s linear infinite; }
  .baila { animation: bailar .96s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes bailar {
    0%, 100% { transform: translateY(0) rotate(-6deg) scale(1.04, .96); }
    25% { transform: translateY(-40px) rotate(0) scale(1); }
    50% { transform: translateY(0) rotate(6deg) scale(1.04, .96); }
    75% { transform: translateY(-40px) rotate(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .gira, .baila, .eq i { animation: none; } }

  /* La canción de la fiesta: el reproductor de YouTube en una tarjeta, arriba a la derecha (escenas 0 y 6). */
  .sonando { position: absolute; top: 3.2%; right: 3.2%; width: 31%; padding: 1.1%; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; box-shadow: 0 14px 40px rgba(0, 0, 0, .5); font-size: clamp(10px, 1.55vmin, 17px); transition: opacity .45s, transform .45s cubic-bezier(.3,1.4,.5,1); }
  .sonando.fuera { opacity: 0; transform: translateY(-18px) scale(.96); pointer-events: none; }
  /* En las novedades se hace chiquita y se acomoda junto a la cabecera, sin tapar las barritas. */
  .sonando { transition: opacity .45s, transform .45s cubic-bezier(.3,1.4,.5,1), width .5s cubic-bezier(.2,.8,.2,1), top .5s cubic-bezier(.2,.8,.2,1), right .5s cubic-bezier(.2,.8,.2,1), padding .5s; }
  .sonando.mini { top: 1.4%; right: 8.33%; width: 19%; padding: .45%; }
  .sonando.mini .sonando-cab { display: none; }
  /* Tú bailando, recortado, a la izquierda (baile.webm, con transparencia y en bucle). En las novedades, chiquito
     junto a la tarjeta de la canción. Es material propio: no entra al repo (.gitignore). */
  .baile { position: absolute; left: 3.2%; top: 8.5%; height: 48%; pointer-events: none; transition: opacity .45s, left .5s cubic-bezier(.2,.8,.2,1), top .5s cubic-bezier(.2,.8,.2,1), height .5s cubic-bezier(.2,.8,.2,1); }
  .baile.mini { left: 65.4%; top: .8%; height: 11%; }
  .baile.fuera { opacity: 0; }
  .sonando-cab { display: flex; align-items: center; gap: .75em; margin: .1em .2em .75em; line-height: 1.2; }
  .sonando-cab span { display: block; color: var(--amber); font-size: .78em; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .sonando-cab b { display: block; color: var(--text); font-weight: 800; }
  .sonando-cab small { color: var(--muted); font-size: 1em; font-weight: 600; }
  .eq { display: flex; align-items: flex-end; gap: 3px; width: 1.7em; height: 1.7em; flex: none; }
  .eq i { flex: 1; height: 100%; background: var(--amber); border-radius: 2px; transform-origin: bottom; animation: eq 1.1s steps(6) infinite; }
  .eq i:nth-child(2) { animation-delay: -.4s; } .eq i:nth-child(3) { animation-delay: -.75s; } .eq i:nth-child(4) { animation-delay: -.2s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.25); } 30% { transform: scaleY(1); } 55% { transform: scaleY(.5); } 80% { transform: scaleY(.85); } }
  .sonando-video { aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #000; }
  .sonando-video iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>

/* ---------- Ir de una a otra ---------- */
let actual = -1, token = 0, pulso = null;
const cab = document.getElementById('cabecera');
const sigBtn = document.getElementById('siguiente'), antBtn = document.getElementById('anterior');
const sigTxt = document.getElementById('sig-texto'), sigIco = document.getElementById('sig-icono'), cuenta = document.getElementById('cuenta');
const brilloStops = [...document.querySelectorAll('#brillo stop')];
const TONO = [C.amber, C.bad, C.amber2, C.ok, C.amber, C.bad, C.ok, C.amber];

function limpiar(e) {
  e.getAnimations({ subtree: true }).forEach((a) => { if (!(a instanceof CSSAnimation)) a.cancel(); });
  todos(e, '.temporal').forEach((n) => n.remove());
}
function pulsar() {
  if (quieto) return;
  pulso = sigBtn.animate([{ boxShadow: '0 0 0 0 rgba(232, 163, 61, .6)' }, { boxShadow: '0 0 0 16px rgba(232, 163, 61, 0)' }], { duration: 1400, iterations: Infinity });
}
// La canción: arranca con la fiesta (el reproductor oficial de YouTube, que se carga hasta entonces), sigue en las
// novedades en chiquito y se quita con «Terminar» (el final). Dentro de Sloth suena sola (Electron deja reproducir sin
// clic); en un navegador, que no deja sonar nada sin un clic, espera y arranca con el primer clic o tecla.
const YT_ID = '-q_S27LbNKU'; // ATEEZ - BAD (Official MV)
const YT_DESDE = 29; // El segundo de la canción donde arranca la fiesta
const sonando = document.getElementById('sonando'), yt = document.getElementById('yt'), baile = document.getElementById('baile');
const ordenar = (func) => yt.contentWindow?.postMessage(JSON.stringify({ event: 'command', func, args: [] }), '*');
// Sin este saludo, el reproductor no siempre atiende las órdenes de la página.
yt.addEventListener('load', () => yt.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'));
const darSonido = () => {
  removeEventListener('pointerdown', darSonido, true); removeEventListener('keydown', darSonido, true);
  if (yt.src && actual < 7) ordenar('playVideo');
};
if (!enSloth) { addEventListener('pointerdown', darSonido, true); addEventListener('keydown', darSonido, true); }
function musica(i) {
  const suena = i < 7;
  for (const el of [sonando, baile]) {
    el.classList.toggle('fuera', !suena);
    el.classList.toggle('mini', i >= 1 && i <= 6);
  }
  if (suena) baile.play().catch(() => {}); else baile.pause();
  if (suena && !yt.src) {
    const origen = location.origin !== 'null' ? `&origin=${encodeURIComponent(location.origin)}` : '';
    yt.src = `https://www.youtube-nocookie.com/embed/${YT_ID}?autoplay=1&start=${YT_DESDE}&enablejsapi=1&playsinline=1&rel=0${origen}`;
  } else if (yt.src) {
    ordenar(suena ? 'playVideo' : 'pauseVideo');
  }
}
function interfaz(i, antes) {
  musica(i);
  antBtn.classList.toggle('oculto', i === 0);
  sigTxt.textContent = i === 0 ? 'Ver lo nuevo' : i === 6 ? 'Terminar' : i === 7 ? (enSloth ? 'Empezar a crear' : 'Ver otra vez') : 'Siguiente';
  sigIco.setAttribute('href', i === 7 && !enSloth ? '#i-reabrir' : '#i-flecha');
  cuenta.textContent = i >= 1 && i <= 6 ? `${i} de 6` : '';
  brilloStops.forEach((s) => (s.style.stopColor = TONO[i]));
  document.getElementById('rayos').style.opacity = i === 0 || i === 7 ? 0 : 0.3;
  const dentro = (k) => k >= 1 && k <= 6;
  if (dentro(i) && !dentro(antes)) A(cab, [{ opacity: 0, transform: 'translateY(-40px)' }, { opacity: 1, transform: 'none' }], { duration: 600, delay: 150 });
  if (!dentro(i) && dentro(antes)) A(cab, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-40px)' }], { duration: 350 });
  todos(cab, '.barra-llena').forEach((b, k) => {
    b.getAnimations().forEach((a) => a.cancel());
    if (k === i - 1) A(b, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 800, delay: 200 });
    else b.style.transform = `scaleX(${k < i - 1 ? 1 : 0})`;
  });
}
function ir(i, dir = 1) {
  if (i < 0 || i >= N || i === actual) return;
  if (pulso) { pulso.cancel(); pulso = null; }
  const antes = actual, prev = antes >= 0 ? escenas[antes] : null;
  const t = ++token, vivo = () => t === token;
  if (prev) {
    const s = A(prev, [{ opacity: 1, transform: 'translateX(0)' }, { opacity: 0, transform: `translateX(${-dir * 180}px)` }], { duration: 380, easing: 'cubic-bezier(.5,0,.8,.3)' });
    s.finished.then(() => { if (escenas[actual] !== prev) { prev.classList.remove('visible'); limpiar(prev); } }, () => {});
  }
  const e = escenas[i];
  limpiar(e); e.classList.add('visible');
  A(e, [{ opacity: 0, transform: `translateX(${dir * 200}px)` }, { opacity: 1, transform: 'translateX(0)' }], { duration: 750, delay: prev ? 220 : 0, easing: 'cubic-bezier(.2,1.1,.3,1)' });
  actual = i;
  interfaz(i, antes);
  guiones[i](e, vivo);
}
const siguiente = () => (actual === N - 1 ? (enSloth ? cerrarGuia() : ir(0, 1)) : ir(actual + 1, 1));
if (enSloth) document.querySelector('.despedida').textContent = 'Gracias por crear con Sloth.';
const anterior = () => ir(actual - 1, -1);
sigBtn.addEventListener('click', siguiente);
antBtn.addEventListener('click', anterior);
addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { ev.preventDefault(); siguiente(); }
  if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { ev.preventDefault(); anterior(); }
  if (ev.key === 'Escape' && enSloth) cerrarGuia();
});
// Deslizar con el dedo
let x0 = null;
const esc_ = document.getElementById('escenario');
esc_.addEventListener('pointerdown', (ev) => (x0 = ev.clientX));
esc_.addEventListener('pointerup', (ev) => { if (x0 === null) return; const d = ev.clientX - x0; x0 = null; if (Math.abs(d) > 60) d < 0 ? siguiente() : anterior(); });

document.fonts.ready.then(() => {
  construir();
  escenas.forEach((e) => e.classList.add('visible'));
  todos(svg, '.partir-letras').forEach((t) => partir(t, 'letra'));
  todos(svg, '.partir-palabras').forEach((t) => partir(t, 'palabra'));
  escenas.forEach((e) => e.classList.remove('visible'));
  const pedida = +new URLSearchParams(location.search).get('escena') || 0;
  ir(Math.min(Math.max(pedida, 0), N - 1));
});
